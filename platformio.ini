; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` builds only the board by default; the native host-test env is
; opt-in via `pio test -e native`.
default_envs = motion2350pro

; Cytron Motion 2350 Pro (RP2350A) — the robot brain.
; arduino-pico (earlephilhower) core via the community PlatformIO platform.
; Builds firmware.uf2 (flashed via the BOOTLOAD serial command or BOOTSEL).
[env:motion2350pro]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = cytron_motion_2350_pro
board_build.core = earlephilhower
; Force newlib's float printf back in: without it, Serial.printf("%.2f") prints
; nothing (GSTATUS/telemetry lose all decimal fields). print(float) is unaffected.
; NOTE: no space after -u — PlatformIO would mis-parse "-u SYM" as a library.
build_flags =
	-u_printf_float
lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.0
monitor_speed = 115200

; Host-side unit tests for the pure-logic gyro controllers (no hardware).
; Run with: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<GyroStraight.cpp> +<GyroTurn.cpp>
build_flags = -std=gnu++17
test_filter = test_gyro
