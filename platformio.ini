[platformio]
default_envs = robot

; Cytron Motion 2350 Pro (RP2350A) on the earlephilhower arduino-pico core.
[env:robot]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board = cytron_motion_2350_pro
board_build.core = earlephilhower
; Without this, Serial.printf("%f") prints nothing. It has to be spelled as a
; linker flag: PlatformIO silently drops a bare -u_printf_float.
build_flags = -Wl,-u,_printf_float
lib_deps =
	adafruit/Adafruit NeoPixel@^1.12.0
	pololu/VL53L0X@^1.3.1
monitor_speed = 115200

; Host tests for the pure control math: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = +<Control.cpp>
build_flags = -std=gnu++17
