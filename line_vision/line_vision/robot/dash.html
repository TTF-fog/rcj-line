<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot dashboard</title>
<style>
  :root {
    --bg: #0d1014; --card: #161b22; --line: #262d36; --text: #e6edf3; --dim: #8b949e;
    --green: #3fb950; --amber: #d29922; --red: #f85149; --blue: #58a6ff; --violet: #bc8cff;
    --silver: #c9d1d9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 600; }
  .chip { padding: 3px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
          color: var(--dim); font-size: 12px; white-space: nowrap; }
  .chip b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--red); }
  .online .dot { background: var(--green); }
  main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 16px; padding: 16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  .side { display: grid; gap: 16px; align-content: start; }
  .cam { position: relative; aspect-ratio: 4 / 3; background: #000; border-radius: 8px; overflow: hidden; }
  .cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .cam .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .cmd { margin-top: 10px; font-size: 12px; color: var(--dim); min-height: 1.4em; white-space: pre; overflow-x: auto; }

  .phase { font-size: 28px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
  .phase.ready { color: var(--blue); } .phase.line { color: var(--green); } .phase.zone { color: var(--violet); }
  .phase.stuck { color: var(--red); } .phase.finished { color: var(--amber); }
  .steps { display: flex; margin-top: 14px; }
  .step { flex: 1; text-align: center; font-size: 11px; color: var(--dim); position: relative; padding-top: 16px; }
  .step::before { content: ""; position: absolute; top: 0; left: 50%; width: 10px; height: 10px; margin-left: -5px;
                  border-radius: 50%; background: var(--line); }
  .step::after { content: ""; position: absolute; top: 4px; left: calc(50% + 8px); right: calc(-50% + 8px); height: 2px; background: var(--line); }
  .step:last-child::after { display: none; }
  .step.done::before { background: var(--violet); } .step.done::after { background: var(--violet); }
  .step.now { color: var(--text); font-weight: 600; }
  .step.now::before { background: var(--violet); box-shadow: 0 0 0 4px rgba(188, 140, 255, .25); }

  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .clock { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .lops { text-align: right; } .lops .n { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .label { color: var(--dim); font-size: 12px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 10px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--green); transition: width .3s, background .3s; }

  .victims { display: flex; gap: 18px; justify-content: space-around; }
  .victim { text-align: center; font-size: 11px; color: var(--dim); }
  .ball { width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 6px; border: 2px dashed var(--line); }
  .ball.silver.held, .ball.silver.rescued { background: radial-gradient(circle at 35% 30%, #fff, var(--silver) 40%, #6e7681); border: 0; }
  .ball.black.held, .ball.black.rescued { background: radial-gradient(circle at 35% 30%, #6e7681, #161b22 60%); border: 2px solid #484f58; }
  .ball.held { animation: pulse 1.4s infinite; }
  .ball.rescued { box-shadow: 0 0 0 3px var(--green); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(88, 166, 255, .35); } }

  .buttons { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
  button { font: inherit; font-weight: 600; padding: 14px; border-radius: 8px; border: 1px solid var(--line);
           background: #21262d; color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { filter: brightness(1.2); }
  button:disabled { opacity: .4; cursor: default; }
  #press { background: var(--green); border-color: var(--green); color: #04130a; }
  #press.lop { background: var(--red); border-color: var(--red); color: #fff; }
  .note { margin-top: 8px; font-size: 11px; color: var(--dim); }

  .tof { display: grid; grid-template-columns: 1fr 64px 1fr; grid-template-rows: auto 64px auto; gap: 6px;
         align-items: center; justify-items: center; }
  .tof .body { grid-area: 2 / 2; width: 64px; height: 64px; border: 2px solid var(--line); border-radius: 8px;
               display: grid; place-items: center; color: var(--dim); font-size: 10px; }
  .tof .v { font-variant-numeric: tabular-nums; }
  .sys { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin-top: 12px; font-size: 12px; }
  .sys span:nth-child(odd) { color: var(--dim); }

  .log { grid-column: 1 / -1; }
  #log { height: 260px; overflow-y: auto; font-size: 12px; margin: 0; white-space: pre-wrap; word-break: break-word; }
  #log .lop { color: var(--red); } #log .warn { color: var(--amber); } #log .zone { color: var(--violet); }
  #log .goal { color: var(--green); font-weight: 600; } #log .line { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>RCJ Rescue Line</h1>
  <span class="chip" id="conn"><span class="dot"></span><span id="conn-text">offline</span></span>
  <span class="chip">board <b id="board">-</b></span>
  <span class="chip">cpu <b id="temp">-</b></span>
</header>

<main>
  <section class="card">
    <h2>Camera</h2>
    <div class="cam"><div class="empty">waiting for frames</div><img id="cam" alt=""></div>
    <div class="cmd mono" id="cmd"></div>
  </section>

  <div class="side">
    <section class="card">
      <h2>State</h2>
      <div class="phase" id="phase">-</div>
      <div class="steps" id="steps"></div>
    </section>

    <section class="card">
      <h2>Run</h2>
      <div class="row">
        <div><div class="clock" id="clock">0:00</div><div class="label">of 8:00</div></div>
        <div class="lops"><div class="n" id="lops">0</div><div class="label">lack of progress</div></div>
      </div>
      <div class="bar"><div id="bar"></div></div>
    </section>

    <section class="card">
      <h2>Victims</h2>
      <div class="victims" id="victims"></div>
    </section>

    <section class="card">
      <h2>Control</h2>
      <div class="buttons">
        <button id="press">Start</button>
        <button id="hold">New run</button>
      </div>
      <div class="note">Bench use. During an official run only the robot's own buttons may be used.</div>
    </section>

    <section class="card">
      <h2>Sensors</h2>
      <div class="tof mono">
        <div style="grid-area: 1 / 2" class="v" id="tof-front">-</div>
        <div style="grid-area: 2 / 1" class="v" id="tof-left">-</div>
        <div class="body">TOF mm</div>
        <div style="grid-area: 2 / 3" class="v" id="tof-right">-</div>
        <div style="grid-area: 3 / 2" class="v" id="tof-back">-</div>
      </div>
      <div class="sys" id="sys"></div>
    </section>
  </div>

  <section class="card log">
    <h2>Log</h2>
    <pre id="log" class="mono"></pre>
  </section>
</main>

<script>
const STEPS = ["enter", "collect", "green", "red", "exit"];
const $ = id => document.getElementById(id);
let running = false, lastLog = "";

function fmt(s) { s = Math.floor(s); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }

function victims(s) {
  const out = [];
  for (const colour of ["silver", "black"]) {
    const done = s.delivered[colour] || 0, held = s.held[colour] || 0;
    for (let i = 0; i < s.want[colour]; i++) {
      const st = i < done ? "rescued" : i < done + held ? "held" : "missing";
      out.push(`<div class="victim"><div class="ball ${colour} ${st}"></div>${colour}<br>${st}</div>`);
    }
  }
  $("victims").innerHTML = out.join("");
}

function steps(s) {
  const now = s.phase === "zone" ? STEPS.indexOf(s.zone_step) : -1;
  $("steps").innerHTML = STEPS.map((n, i) =>
    `<div class="step ${i < now ? "done" : i === now ? "now" : ""}">${n}</div>`).join("");
}

function logClass(l) {
  if (/lack of progress #/.test(l)) return "lop";
  if (/WARNING|ERR|Traceback|stuck|not found|lost|timed out/.test(l)) return "warn";
  if (/goal/.test(l)) return "goal";
  if (/\[zone/.test(l)) return "zone";
  if (/\[line\]/.test(l)) return "line";
  return "";
}

function render(s) {
  running = s.running;
  $("phase").textContent = s.phase;
  $("phase").className = "phase " + s.phase;
  steps(s);
  $("clock").textContent = fmt(s.clock);
  $("lops").textContent = s.lops;
  const frac = Math.min(1, s.clock / 480);
  $("bar").style.width = frac * 100 + "%";
  $("bar").style.background = frac > 0.9 ? "var(--red)" : frac > 0.75 ? "var(--amber)" : "var(--green)";
  victims(s);
  $("cmd").textContent = s.phase === "line" ? s.line : s.phase === "zone" ? `zone ${s.zone_step}` : "";
  $("press").textContent = running ? "Lack of Progress" : "Start";
  $("press").classList.toggle("lop", running);
  $("hold").disabled = running;
  $("board").textContent = s.board;
  $("temp").textContent = s.temp.toFixed(0) + " °C";
  $("temp").style.color = s.temp > 80 ? "var(--red)" : s.temp > 70 ? "var(--amber)" : "";
  for (const k of ["front", "back", "left", "right"]) $("tof-" + k).textContent = s.tof ? s.tof[k] : "-";
  $("sys").innerHTML = Object.entries(s.cameras).map(([k, v]) => `<span>${k} camera</span><span>${v}</span>`).join("");

  const text = s.log.join("\n");
  if (text !== lastLog) {
    const el = $("log"), atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
    el.innerHTML = s.log.map(l => `<span class="${logClass(l)}">${l.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</span>`).join("\n");
    if (atBottom) el.scrollTop = el.scrollHeight;
    lastLog = text;
  }
}

function online(ok) {
  $("conn").classList.toggle("online", ok);
  $("conn-text").textContent = ok ? "live" : "offline";
}

async function poll() {
  try {
    const r = await fetch("/state");
    render(await r.json());
    online(true);
  } catch (e) {
    online(false);
  }
  setTimeout(poll, 300);
}

function connectStream() {
  const img = $("cam");
  img.onerror = () => setTimeout(connectStream, 1000);
  img.src = "/stream?" + Date.now();
}

$("press").onclick = () => fetch("/press", { method: "POST" });
$("hold").onclick = () => fetch("/hold", { method: "POST" });
connectStream();
poll();
</script>
</body>
</html>
